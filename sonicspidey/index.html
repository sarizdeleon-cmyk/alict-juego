<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f7dff">
<title>Sonic y Spider-Man</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sonic y Spider-Man">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#1d2b64;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{font-family:ui-rounded,"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:800;color:#fff}
button,a{font:inherit;color:inherit;border:0;cursor:pointer;text-decoration:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pant{position:fixed;inset:0;display:none;z-index:10;align-items:center;justify-content:center;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.pant.activa{display:flex;animation:fade .35s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bota{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes toca{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(8px) scale(.9)}}

/* ---------- inicio ---------- */
#inicio{background:linear-gradient(105deg,#2f7dff 0 49.6%,#fff 49.6% 50.4%,#e63946 50.4%);overflow:hidden;text-align:center;gap:1.2vh;justify-content:center}
#inicio .rayos{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 40%,rgba(255,255,255,.09) 0 8deg,transparent 8deg 20deg);animation:gira 60s linear infinite}
.titulo{position:relative;z-index:2;margin:0;font-size:clamp(30px,min(8vw,12.5vh),92px);line-height:.95;letter-spacing:1px;color:#ffe066;text-shadow:0 5px 0 #c2410c,0 10px 0 rgba(0,0,0,.28),0 0 30px rgba(255,224,102,.5)}
.titulo .t1{color:#fff;text-shadow:0 5px 0 #1d4ed8,0 10px 0 rgba(0,0,0,.28),0 0 26px rgba(80,150,255,.9)}.titulo .t2{color:#fff;text-shadow:0 5px 0 #b3121f,0 10px 0 rgba(0,0,0,.28),0 0 26px rgba(255,90,100,.9)}.titulo small{font-size:.5em;color:#ffe066;text-shadow:0 3px 0 #c2410c}
.burbuja{position:relative;z-index:2;background:#fff;color:#1e3a8a;border-radius:24px;padding:.3em .9em;box-shadow:0 6px 0 rgba(0,0,0,.28);font-size:clamp(15px,min(3.6vw,5.4vh),30px);line-height:1.1;text-wrap:balance;max-width:92vw}
.burbuja em{font-style:normal;color:#e65a00}
#heroes{position:relative;z-index:2;display:flex;gap:min(4vw,40px);justify-content:center;align-items:flex-end}
.heroe{position:relative;width:min(34vw,330px);height:min(40vh,300px);border-radius:28px;padding:10px 10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;
  border:5px solid rgba(255,255,255,.35);background:rgba(0,0,0,.28);opacity:.78;transform:scale(.93);transition:transform .2s,opacity .2s,background .2s,border-color .2s}
.heroe.sonic.sel{background:linear-gradient(#5aa2ff,#1d4fd1)}
.heroe.spider.sel{background:linear-gradient(#ff7a85,#b3121f)}
.heroe.sel{opacity:1;transform:scale(1.04);border-color:#ffe066;box-shadow:0 0 28px rgba(255,224,102,.85),0 8px 0 rgba(0,0,0,.3)}
.heroe img{flex:1;min-height:0;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4));pointer-events:none}
.heroe.sel img{animation:bota 1.1s ease-in-out infinite}
.heroe span{font-size:clamp(20px,min(4.4vw,6.4vh),40px);line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.botones{position:relative;z-index:2;display:flex;gap:2vw;align-items:center;flex-wrap:wrap;justify-content:center}
.grande{position:relative;z-index:2;background:linear-gradient(#6dea5e,#2fb82a);color:#fff;font-size:clamp(22px,min(5.6vw,8vh),44px);padding:.38em 1.3em;border-radius:999px;display:inline-block;
  box-shadow:0 8px 0 #1a7a17,0 0 24px rgba(109,234,94,.5);text-shadow:0 3px 0 rgba(0,0,0,.3);animation:latido 1.4s ease-in-out infinite}
.grande:active{transform:translateY(6px);box-shadow:0 2px 0 #1a7a17}
.grande.chico{font-size:clamp(15px,min(3.4vw,5vh),24px);animation:none;background:linear-gradient(#a579ff,#6a3fd1);box-shadow:0 6px 0 #3c1f8c}

/* ---------- botones redondos ---------- */
.cir{position:fixed;z-index:12;top:max(10px,env(safe-area-inset-top));width:clamp(44px,8.5vmin,62px);aspect-ratio:1;border-radius:50%;background:rgba(20,6,43,.6);display:grid;place-items:center;border:2px solid rgba(255,255,255,.5);padding:0}
.cir svg{width:56%;height:56%}
#bCasa{left:max(10px,env(safe-area-inset-left));background:linear-gradient(#6dea5e,#2fb82a);border:3px solid #fff;box-shadow:0 4px 0 #1a7a17}
#bSonido{right:max(10px,env(safe-area-inset-right))}
.cir:active{transform:translateY(3px)}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:max(8px,env(safe-area-inset-top));z-index:11;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#hud .nivel{background:rgba(20,6,43,.62);border:2px solid rgba(255,255,255,.4);border-radius:999px;padding:.12em .9em;font-size:clamp(14px,3.2vh,24px);letter-spacing:.4px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#prog{position:relative;width:min(46vw,420px);height:clamp(10px,2.2vh,16px);border-radius:99px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.7)}
#prog i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#ffe066,#ff9a2e);width:0}
#prog img{position:absolute;top:50%;height:clamp(26px,6.4vh,46px);width:auto;transform:translate(-50%,-62%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
#prog b{position:absolute;right:-5px;top:50%;transform:translate(0,-50%);font-size:clamp(14px,3vh,22px)}
#estrellas{position:fixed;z-index:11;left:max(78px,calc(env(safe-area-inset-left) + 70px));top:max(14px,env(safe-area-inset-top));background:rgba(20,6,43,.62);border:2px solid rgba(255,255,255,.4);border-radius:999px;padding:.1em .75em;font-size:clamp(16px,3.8vh,28px);pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#estrellas span{color:#ffd43b}
#aviso{position:fixed;left:50%;top:24%;transform:translateX(-50%) scale(.8);z-index:11;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;
  background:#fff;color:#1e3a8a;border-radius:24px;padding:.3em 1em;font-size:clamp(18px,4.6vh,34px);box-shadow:0 6px 0 rgba(0,0,0,.3);text-align:center;max-width:90vw}
#aviso.v{opacity:1;transform:translateX(-50%) scale(1)}
#toca{position:fixed;left:50%;bottom:calc(5% + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:11;pointer-events:none;display:flex;align-items:center;gap:10px;
  background:rgba(20,6,43,.62);border:2px solid rgba(255,255,255,.55);border-radius:999px;padding:.2em .9em .2em .4em;font-size:clamp(15px,3.6vh,26px);text-shadow:0 2px 0 rgba(0,0,0,.4)}
#toca svg{width:clamp(30px,6vh,48px);animation:toca 1s ease-in-out infinite}

/* ---------- tarjeta ---------- */
#tarjeta{background:rgba(15,25,70,.88);gap:1.2vh;text-align:center}
#tarjeta h2{position:relative;margin:0;font-size:clamp(26px,min(6.6vw,10vh),60px);line-height:1;color:#ffe066;text-shadow:0 4px 0 #c2410c,0 0 22px rgba(255,224,102,.6);max-width:92vw}
#tarjeta p{margin:0;font-size:clamp(16px,min(3.8vw,5.6vh),30px);line-height:1.2;text-wrap:balance;max-width:min(92vw,820px);text-shadow:0 2px 0 rgba(0,0,0,.4)}
#tEst{display:flex;gap:1.4vw;justify-content:center}
#tEst svg{width:clamp(36px,min(11vw,13vh),100px);filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
#tEst svg.on{animation:bota 1s ease-in-out infinite}
#tEst svg.on:nth-child(2){animation-delay:-.3s}#tEst svg.on:nth-child(3){animation-delay:-.6s}
#tSprunki{height:min(24vh,200px);animation:bota 1.1s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.35))}
#tFila{display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;max-width:92vw}
#tFila img{height:min(12vh,100px);width:auto;animation:bota 1.2s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))}
#tFila img:nth-child(2n){animation-delay:-.4s}#tFila img:nth-child(3n){animation-delay:-.8s}

/* ---------- girar pantalla ---------- */
#girar{position:fixed;inset:0;z-index:50;background:#1d2b64;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;font-size:clamp(20px,5vw,32px);padding:20px}
#girar svg{width:90px;animation:gira 3s ease-in-out infinite alternate}
@media (orientation:portrait){#girar{display:flex}}
@media (prefers-reduced-motion:reduce){#inicio .rayos{animation:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- ============ INICIO ============ -->
<section id="inicio" class="pant activa">
  <div class="rayos"></div>
  <h1 class="titulo" aria-label="Sonic y Spider-Man"><span class="t1">SONIC</span> <small>Y</small> <span class="t2">SPIDER-MAN</span></h1>
  <div class="burbuja">HOLA <em>ALICT</em>, ¿QUIÉN CORRE HOY?</div>
  <div id="heroes"></div><span id="eNom" hidden></span>
  <div class="botones"><button id="bJugar" class="grande">¡A CORRER!</button><button id="bContinuar" class="grande chico" hidden></button></div>
</section>

<!-- ============ TARJETA (nivel listo / ganaste) ============ -->
<section id="tarjeta" class="pant">
  <h2 id="tTitulo"></h2>
  <div id="tEst"></div>
  <img id="tSprunki" alt="" hidden>
  <div id="tFila" hidden></div>
  <p id="tTexto"></p>
  <div class="botones"><button id="tBoton" class="grande"></button><button id="tCambiar" class="grande chico">CAMBIAR DE HÉROE</button></div>
</section>

<button class="cir" id="bSonido" aria-label="Sonido"></button>
<div id="hud" hidden><div class="nivel" id="hNivel"></div><div id="prog"><i id="pBarra"></i><img id="pCara" alt=""><b>🏁</b></div></div>

<div id="aviso"></div>

<div id="girar"><svg viewBox="0 0 64 64"><rect x="14" y="6" width="36" height="52" rx="6" fill="none" stroke="#ffb347" stroke-width="4"/><path d="M52 24 q10 8 0 16" fill="none" stroke="#ffb347" stroke-width="4" stroke-linecap="round"/><path d="M50 42 l4 -4 l1 6z" fill="#ffb347" stroke="#ffb347" stroke-width="2"/></svg><div>Gira tu pantalla para jugar, Alict</div></div>

/* ================= Pantallas y flujo ================= */
function mostrar(id) { document.querySelectorAll('.pant').forEach(p => p.classList.toggle('activa', p.id === id)); }

  return `<svg viewBox="-12 -12 24 24" class="${on ? 'on' : ''}"><path d="${d}Z" fill="${on ? '#ffd43b' : 'rgba(255,255,255,.22)'}" stroke="${on ? '#b8710a' : 'rgba(255,255,255,.5)'}" stroke-width="1.2" stroke-linejoin="round"/></svg>`; };

/* ----- elegir héroe: Sonic o Spider-Man ----- */
const grilla = $('#heroes');
JUG.forEach((h, k) => {
  const b = document.createElement('button'); b.className = 'heroe ' + h.id; b.setAttribute('aria-label', h.nombre);

});
/* los dos héroes corren en su tarjeta; el elegido es el que más se mueve */
let animaI = 0; setInterval(() => { if (est !== 'inicio') return; animaI++; JUG.forEach((h, k) => { grilla.children[k].firstChild.src = IM[k === sel ? h.run[animaI % h.run.length] : h.idle[0]].src; }); }, 90);
function elegir(k, voz) {
  sel = k; P.id = JUG[k].id; try { localStorage.setItem('alictSonicHeroe', P.id); } catch (e) {}
  [...grilla.children].forEach((b, i) => b.classList.toggle('sel', i === k));
  $('#eNom').textContent = JUG[k].nombre.toUpperCase();

function pintarInicio() {
  const g0 = guardado(), b = $('#bContinuar');

}
function volverInicio() { est = 'inicio'; nivel = null; musicaOff(); juegoUI(false); parts.length = 0; pintarInicio(); mostrar('inicio'); elegir(sel, false); }

/* ----- empezar un nivel ----- */

addEventListener('load', () => setTimeout(() => { if (!saludado && est === 'inicio') saludar(); }, 500));
