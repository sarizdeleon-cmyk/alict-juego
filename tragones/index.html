<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ff8a3d">
<title>Tíos Tragones</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tíos Tragones">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#2a0f4a;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{font-family:ui-rounded,"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:800;color:#fff}
button,a{font:inherit;color:inherit;border:0;cursor:pointer;text-decoration:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pant{position:fixed;inset:0;display:none;z-index:10;align-items:center;justify-content:center;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.pant.activa{display:flex;animation:fade .35s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bota{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---------- inicio ---------- */
#inicio{background:radial-gradient(circle at 50% 0,#ff9a3d,#d9344f 55%,#5a1a6b);overflow:hidden;gap:1.6vh;text-align:center}
#inicio .conf{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 3px,transparent 4px),radial-gradient(circle,#ffe066 0 4px,transparent 5px),radial-gradient(circle,#7be0ff 0 3px,transparent 4px);background-size:150px 130px,210px 170px,260px 190px;background-position:10px 20px,90px 70px,150px 10px;opacity:.55;animation:cae 14s linear infinite}
@keyframes cae{to{background-position:10px 1020px,90px 1070px,150px 1010px}}
.hero{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;gap:1.4vw}
.hero .chef{position:relative;width:min(26vw,30vh,230px);aspect-ratio:1;flex:none}
.hero .chef .foto{position:absolute;inset:14% 12% 0;border-radius:50%;overflow:hidden;border:6px solid #fff;box-shadow:0 10px 24px rgba(0,0,0,.4);background:#fff}
.hero .chef .foto img{width:100%;height:100%;object-fit:cover;display:block}
.hero .chef svg{position:absolute;left:18%;top:-8%;width:64%;filter:drop-shadow(0 5px 4px rgba(0,0,0,.35))}
.hero .tio{width:min(15vw,18vh,120px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 8px 16px rgba(0,0,0,.4);animation:bota 2.2s ease-in-out infinite}
.hero .tio:nth-of-type(2){animation-delay:-.7s}.hero .tio:nth-of-type(3){animation-delay:-1.4s}.hero .tio:nth-of-type(4){animation-delay:-.35s}
.hero .tio.panza{transform-origin:50% 100%;animation:panza 1.6s ease-in-out infinite alternate}
@keyframes panza{from{transform:scale(.92,.92)}to{transform:scale(1.18,1.1)}}
.titulo{position:relative;z-index:2;margin:0;font-size:clamp(34px,min(9.2vw,14vh),104px);line-height:.95;letter-spacing:1px;color:#ffe066;text-shadow:0 5px 0 #a3311c,0 10px 0 rgba(0,0,0,.28),0 0 30px rgba(255,224,102,.5)}
.titulo em{display:block;font-style:normal;color:#fff;text-shadow:0 5px 0 #d9344f,0 10px 0 rgba(0,0,0,.28)}
.burbuja{position:relative;z-index:2;background:#fff;color:#4a1a5e;border-radius:26px;padding:.4em .9em;box-shadow:0 7px 0 rgba(0,0,0,.3);font-size:clamp(17px,min(4.6vw,6vh),36px);line-height:1.12;text-wrap:balance;max-width:92vw}
.burbuja em{font-style:normal;color:#e65a00}
.grande{position:relative;z-index:2;background:linear-gradient(#6dea5e,#2fb82a);color:#fff;font-size:clamp(24px,min(6vw,8.5vh),46px);padding:.5em 1.4em;border-radius:999px;display:inline-block;
  box-shadow:0 8px 0 #1a7a17,0 0 24px rgba(109,234,94,.5);text-shadow:0 3px 0 rgba(0,0,0,.3);animation:latido 1.4s ease-in-out infinite}
.grande:active{transform:translateY(6px);box-shadow:0 2px 0 #1a7a17}
.grande.chico{font-size:clamp(16px,min(3.6vw,5vh),26px);animation:none;background:linear-gradient(#a579ff,#6a3fd1);box-shadow:0 6px 0 #3c1f8c}
.botones{position:relative;z-index:2;display:flex;gap:2vw;align-items:center;flex-wrap:wrap;justify-content:center}

/* ---------- botones redondos ---------- */
.cir{position:fixed;z-index:12;top:max(10px,env(safe-area-inset-top));width:clamp(44px,8.5vmin,62px);aspect-ratio:1;border-radius:50%;background:rgba(20,6,43,.6);display:grid;place-items:center;border:2px solid rgba(255,255,255,.5);padding:0}
.cir svg{width:56%;height:56%}
#bCasa{left:max(10px,env(safe-area-inset-left));background:linear-gradient(#6dea5e,#2fb82a);border:3px solid #fff;box-shadow:0 4px 0 #1a7a17}
#bSonido{right:max(10px,env(safe-area-inset-right))}
.cir:active{transform:translateY(3px)}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:max(8px,env(safe-area-inset-top));z-index:11;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#hud .nivel{background:rgba(20,6,43,.62);border:2px solid rgba(255,255,255,.4);border-radius:999px;padding:.15em .9em;font-size:clamp(15px,3.4vh,26px);letter-spacing:.4px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#caras{display:flex;gap:8px}
#caras img{width:clamp(28px,6vh,46px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid #fff;opacity:.85;transition:transform .3s,filter .3s}
#caras img.ok{opacity:1;transform:scale(1.12);border-color:#ffe066;box-shadow:0 0 12px #ffe066}
#aviso{position:fixed;left:50%;top:22%;transform:translateX(-50%) scale(.8);z-index:11;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;
  background:#fff;color:#4a1a5e;border-radius:24px;padding:.35em 1em;font-size:clamp(18px,4.6vh,34px);box-shadow:0 6px 0 rgba(0,0,0,.3);text-align:center;max-width:90vw}
#aviso.v{opacity:1;transform:translateX(-50%) scale(1)}

/* ---------- tarjeta ---------- */
#tarjeta{background:rgba(25,6,45,.86);gap:2vh;text-align:center;z-index:20}
#tarjeta h2{position:relative;margin:0;font-size:clamp(26px,min(6.6vw,10vh),60px);line-height:1;color:#ffe066;text-shadow:0 4px 0 #a3311c,0 0 22px rgba(255,224,102,.6);max-width:92vw}
#tarjeta p{margin:0;font-size:clamp(16px,min(3.8vw,5.6vh),30px);line-height:1.2;text-wrap:balance;max-width:min(92vw,820px);text-shadow:0 2px 0 rgba(0,0,0,.4)}
#tarjeta .fila{display:flex;gap:1.2vw;flex-wrap:wrap;justify-content:center;max-width:92vw}
#tarjeta .fila img{width:min(11vw,14vh,86px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:4px solid #ffe066;box-shadow:0 0 16px rgba(255,224,102,.6);animation:bota 2.4s ease-in-out infinite}
#tarjeta .fila img:nth-child(2n){animation-delay:-.8s}#tarjeta .fila img:nth-child(3n){animation-delay:-1.6s}

/* ---------- girar pantalla ---------- */
#girar{position:fixed;inset:0;z-index:50;background:#2a0f4a;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;font-size:clamp(20px,5vw,32px);padding:20px}
#girar svg{width:90px;animation:gira 3s ease-in-out infinite alternate}
@media (orientation:portrait){#girar{display:flex}}
@media (prefers-reduced-motion:reduce){.conf{animation:none!important}}
</style>
</head>

</defs></svg>

<canvas id="c"></canvas>

<!-- ============ INICIO ============ -->
<section id="inicio" class="pant activa">
  <div class="conf"></div>
  <div class="hero">
    <img class="tio" id="hI0" alt=""><img class="tio panza" id="hI1" alt="">
    <div class="chef"><div class="foto"><img id="hChef" alt="Alict"></div><svg><use href="#sv-chef"/></svg></div>
    <img class="tio panza" id="hI2" alt=""><img class="tio" id="hI3" alt="">

  <div class="botones"><button id="bJugar" class="grande">¡A COMER!</button></div>
</section>

<!-- ============ TARJETA (nivel listo / ganaste) ============ -->
<section id="tarjeta" class="pant">
  <h2 id="tTitulo"></h2>
  <div class="fila" id="tFila" hidden></div>
  <p id="tTexto"></p>
  <div class="botones"><button id="tBoton" class="grande"></button><a id="tMenu" class="grande chico irMenu" href="../" hidden>MENÚ DE JUEGOS</a></div>
</section>

<a class="cir irMenu" id="bCasa" href="../" aria-label="Volver al menú de juegos"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10.5V20h13v-9.5" fill="#fff"/><rect x="10" y="14" width="4" height="6" rx="1" fill="#2fb82a"/></svg></a>
<button class="cir" id="bSonido" aria-label="Sonido"></button>
<div id="hud" hidden><div class="nivel" id="hNivel"></div><div id="caras"></div></div>
<div id="aviso"></div>

      if (est !== 'nivelok') return; mostrarTarjeta({ titulo: `¡NIVEL ${nivel.n + 1} LISTO!`, texto: `¡Muy bien, ${NOMBRE}! Todos están llenos.<br>Ahora: <b>${ronda.temas[nivel.n + 1].n}</b>.${nivel.n + 1 === NIVELES_RONDA - 1 ? '<br>¡Y ahora vienen tus abuelitos!' : ''}`, boton: '¡SIGUIENTE!', onBoton: () => iniciarNivel(nivel.n + 1) });
      decir(`¡Muy bien, ${NOMBRE}! Todos están llenos. ¡Vamos al siguiente nivel!`, { pitch: 1.12, rate: .95 });
    }, 1400);
  } else {
    setTimeout(() => {
      if (est !== 'nivelok') return; const caras = [...IMGS.tios, ...IMGS.abuelos]; musicaOff();
      mostrarTarjeta({ titulo: `¡GANASTE, ${NOMBRE.toUpperCase()}!`, texto: `¡Tus tíos y tus abuelitos quedaron llenísimos!<br>Gracias por darles de comer, <b>${NOMBRE}</b>.`, boton: '¡JUGAR OTRA VEZ!', onBoton: () => { nuevaRonda(); iniciarNivel(0); }, fila: caras, menu: true });
      decir(`¡Lo lograste, ${NOMBRE}! Tus tíos y tus abuelitos quedaron llenísimos. ¡Eres el mejor cocinero!`, { pitch: 1.12, rate: .95 });
      for (let k = 0; k < 6; k++) setTimeout(() => { if (est === 'nivelok') { confeti(VW * rnd(.15, .85), rnd(80, 200), 40); suena('gana'); } }, k * 600);
    }, 1400);
  }
}
function mostrarTarjeta({ titulo, texto, boton, onBoton, fila, menu }) {
  $('#tTitulo').textContent = titulo; $('#tTexto').innerHTML = texto; $('#tBoton').textContent = boton; $('#tBoton').onclick = () => { suena('click'); onBoton(); };
  const f = $('#tFila'); f.hidden = !fila; if (fila) f.innerHTML = fila.map(s => `<img src="${s}" alt="">`).join('');
  $('#tMenu').hidden = !menu || !web; $('#hud').hidden = true; document.querySelectorAll('.pant').forEach(p => p.classList.toggle('activa', p.id === 'tarjeta'));
}

/* ================= Dibujo principal ================= */
function dibujar() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
  if (!nivel || est === 'inicio') return;
  g.drawImage(fondo(), 0, 0, W, H);
  g.setTransform(DPR * SC, 0, 0, DPR * SC, shake ? rnd(-shake, shake) * DPR : 0, shake ? rnd(-shake, shake) * DPR : 0);
  const orden = chars.slice().sort((a, b) => a.cs - b.cs);
  for (const c of chars) dibujarChar(c);
  // flechas de ayuda
  if (sel || nivel.pista > 0) for (const c of chars) if (c.est === 'espera') { const G = geo(c), yy = G.top - 56 * c.cs + Math.sin(nivel.t * 8) * 8; g.fillStyle = '#ffe066'; g.strokeStyle = '#a3311c'; g.lineWidth = 4; g.beginPath(); g.moveTo(G.x, yy + 26); g.lineTo(G.x - 20, yy); g.lineTo(G.x + 20, yy); g.closePath(); g.fill(); g.stroke(); }
  dibujarBandeja(); dibujarVuelos(); dibujarParts();
  if (drag && drag.moved) { dibujarAlimento(drag.a, drag.x, drag.y - 40, 118, Math.sin(nivel.t * 10) * .1); }
  if (flash > 0) { g.fillStyle = `rgba(255,255,255,${flash * .8})`; g.fillRect(0, 0, VW, LH); }
}
let ult = performance.now();
function bucle(now) {
  const dt = Math.min(.05, Math.max(0, (now - ult) / 1000)); ult = now;
  if (nivel && (est === 'jugando' || est === 'nivelok')) actualizar(dt);
  dibujar(); requestAnimationFrame(bucle);
}

if (!web) document.querySelectorAll('.irMenu').forEach(e => e.hidden = true);
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('.irMenu')) { callar(); suena('click'); } });
const ICO_SON = on => `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z" fill="#fff"/>${on ? '<path d="M15 8q3 4 0 8M18 5q6 7 0 14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>' : '<path d="M16 9l6 6M22 9l-6 6" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round"/>'}</svg>`;
function pintarSonido() { $('#bSonido').innerHTML = ICO_SON(!A.mudo); }
$('#bSonido').addEventListener('click', e => {
  e.stopPropagation(); audio(); A.mudo = !A.mudo; try { localStorage.setItem('alictTragonesMudo', A.mudo ? '1' : '0'); } catch (x) {}
  if (A.out) A.out.gain.setTargetAtTime(A.mudo ? 0 : .9, A.ctx.currentTime, .04); if (A.mudo) { try { speechSynthesis.cancel(); } catch (x) {} } pintarSonido();
});
pintarSonido();
const ids = [0, 1, 2, 3, 4, 5, 6].sort(() => Math.random() - .5);
for (let i = 0; i < 4; i++) $('#hI' + i).src = IMGS.tios[ids[i]];
$('#hChef').src = IMGS.alict.risa;
let saludado = false, pendiente = false;
function saludar() { decir(`¡Hola ${NOMBRE}! ¿Les damos de comer a tus tíos? ¡Tienen mucha hambre!`, { pitch: 1.12, rate: .95 }, ok => { if (ok) { saludado = true; pendiente = false; } else if (!saludado) pendiente = true; }); }
function primerToque() { audio(); if (pendiente && !saludado && est === 'inicio') { pendiente = false; saludar(); } }
['pointerdown', 'touchstart', 'keydown'].forEach(t => addEventListener(t, e => { if (e.target.closest && e.target.closest('#bJugar,.irMenu')) return; primerToque(); }, { capture: true, passive: true }));
$('#bJugar').addEventListener('click', () => { audio(); saludado = true; pendiente = false; callar(); nuevaRonda(); ajustar(); iniciarNivel(0); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { callar(); if (A.ctx && A.ctx.state === 'running') A.ctx.suspend(); } else if (A.ctx && A.on) { A.ctx.resume(); A.t = Math.max(A.t, A.ctx.currentTime + .05); }
});
document.addEventListener('contextmenu', e => e.preventDefault());
ajustar(); requestAnimationFrame(bucle);
addEventListener('load', () => setTimeout(() => { if (!saludado && est === 'inicio') saludar(); }, 500));
if (location.hash === '#debug') window.__t = { get nivel() { return nivel; }, get chars() { return chars; }, get bandeja() { return bandeja; }, get est() { return est; }, iniciarNivel, nuevaRonda, darDeComer, actualizar, dibujar, geo, get ronda() { return ronda; }, TEMAS, CAT, comio, get parts() { return parts; }, get vuelos() { return vuelos; }, set est(v) { est = v; }, nivelListo, A };
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && document.querySelector('link[rel=manifest]')) navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
})();
