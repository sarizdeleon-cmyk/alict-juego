name: APK para Android TV

# Se ejecuta solo cuando cambia algo de tv-apk/ (o a mano desde la pestaña Actions).
# Arma la app con el menú y todos los juegos dentro, la compila y la deja en "Releases" (tag "tv").
on:
  push:
    branches: [main]
    paths:
      - 'tv-apk/**'
      - '.github/workflows/tv-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Meter el menú y los juegos dentro de la app
        run: |
          A=tv-apk/app/src/main/assets/www
          rm -rf "$A"; mkdir -p "$A"
          cp -r tv-apk/tv-home/. "$A/"                      # menú de la tele + personajes
          for j in zombis didacticos sprunkialict tragones corre pelea sonicspidey; do
            mkdir -p "$A/$j"; cp -r "$j/." "$A/$j/"
          done
          find "$A" -name 'sw.js' -delete                   # sin service workers dentro de la app
          du -sh "$A"; ls "$A"

      - name: Compilar el APK
        working-directory: tv-apk
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace -PvCode=${{ github.run_number }} -PvName=1.${{ github.run_number }} 2>&1 | tee ../build.log

      - name: Mostrar los errores (si los hay)
        if: failure()
        run: |
          msg=$(grep -E -B1 -A6 "error:|What went wrong|FAILED|Could not|Caused by" build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Errores del build::${msg}"

      - name: Publicar el APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp tv-apk/app/build/outputs/apk/debug/app-debug.apk JuegosDeAlict.apk
          ls -la JuegosDeAlict.apk
          gh release delete tv --cleanup-tag --yes || true
          gh release create tv JuegosDeAlict.apk --latest \
            --title "Juegos de Alict para Android TV" \
            --notes "Versión $(date -u +%Y-%m-%d) (build ${{ github.run_number }}). Descarga JuegosDeAlict.apk e instálalo en la tele."
