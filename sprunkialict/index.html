<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a0f6b">
<title>Sprunkialict</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sprunkialict">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
  font-family:ui-rounded,"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:800;color:#2b1b4d}
body{background:
  radial-gradient(circle at 18% 8%,#7b3fe4 0,transparent 45%),
  radial-gradient(circle at 88% 92%,#ff5fa2 0,transparent 40%),
  linear-gradient(160deg,#2a0f6b,#4b1d99 60%,#6a2bb8)}
button{font:inherit;color:inherit;border:0;cursor:pointer;padding:0;background:none}
svg{display:block;overflow:visible}
[hidden]{display:none!important}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.pantalla{position:fixed;inset:0;display:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.pantalla.activa{display:flex;animation:fade .35s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ---------- saludo ---------- */
#hello{flex-direction:column;align-items:center;justify-content:center;gap:3.2vh;text-align:center;padding:14px}
.hola-txt{display:flex;flex-direction:column;align-items:center;gap:3.2vh;min-width:0}
@keyframes talk{0%,100%{transform:scale(1,1) rotate(0)}20%{transform:scale(1.06,.94) rotate(-3deg)}45%{transform:scale(.96,1.06) rotate(2deg)}70%{transform:scale(1.05,.95) rotate(3deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,214,64,0)}50%{box-shadow:0 0 0 12px rgba(255,214,64,.6)}}
.portada{width:min(56vw,34vh,300px);aspect-ratio:1;border-radius:50%;padding:9px;
  background:conic-gradient(#ff5a5a,#ffd43b,#51cf66,#4dabf7,#cc5de8,#ff5a5a);box-shadow:0 10px 0 rgba(0,0,0,.25)}
.portada img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:8px solid #fff;background:#fff}
body.habla #hello .portada{animation:talk .34s ease-in-out infinite,glow .68s ease-in-out infinite}
.logo-txt{color:#fff;font-size:clamp(30px,9.5vw,70px);line-height:1;letter-spacing:1px;text-shadow:0 5px 0 rgba(0,0,0,.3)}
.logo-txt em{font-style:normal;color:#ffd43b}
.burbuja{position:relative;background:#fff;color:#2b1b4d;border-radius:30px;padding:.5em .9em;box-shadow:0 8px 0 rgba(0,0,0,.25);
  font-size:clamp(22px,6.4vw,46px);line-height:1.12;text-align:center;text-wrap:balance;max-width:900px}
.burbuja em{font-style:normal;color:#e63e83}
.big-btn{background:linear-gradient(#5be37d,#2fbf56);color:#fff;font-size:clamp(24px,6.5vw,40px);padding:.55em 1.3em;border-radius:999px;
  box-shadow:0 8px 0 #1c8a3b,0 14px 24px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.2);display:flex;align-items:center;gap:.5em;animation:wiggle 1.6s ease-in-out infinite}
.big-btn:active{transform:translateY(6px);box-shadow:0 2px 0 #1c8a3b}
.big-btn svg{width:1em;height:1em}

/* ---------- juego ---------- */
#juego{flex-direction:column;padding:10px 10px calc(10px + env(safe-area-inset-bottom));gap:8px}
.top{display:flex;align-items:center;gap:10px;flex:none}
.foto-top{flex:none;width:clamp(68px,19vw,92px);aspect-ratio:1;border-radius:50%;padding:4px;background:conic-gradient(#ff5a5a,#ffd43b,#51cf66,#4dabf7,#cc5de8,#ff5a5a);box-shadow:0 5px 0 rgba(0,0,0,.28)}
.foto-top img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #fff;background:#fff}
.titulo{flex:1;min-width:0;color:#fff;font-size:clamp(15px,5.2vw,44px);line-height:1;letter-spacing:.5px;text-shadow:0 4px 0 rgba(0,0,0,.3);white-space:nowrap;overflow:hidden;text-overflow:clip}
.titulo em{font-style:normal;color:#ffd43b}
.btn-c{flex:none;width:clamp(48px,13vw,62px);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn-c svg{width:56%;height:56%}
.btn-c.casa{background:linear-gradient(#5be37d,#2fbf56);text-decoration:none}
body.m1 .titulo{font-size:clamp(14px,4.2vw,44px)}
body.m1 .btn-c{width:clamp(40px,11vw,62px)}
.irHello{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top))}
.btn-c.casa[hidden]{display:none}
.btn-c:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn-c.azar{background:linear-gradient(#ffe066,#ffc21a)}

.escenario{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.28);
  background:linear-gradient(var(--bg1,#3b82f6),var(--bg2,#a78bfa));transition:background 1.2s}
.escenario::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 108%,rgba(255,255,255,.35),transparent 60%),radial-gradient(circle at 20% 10%,rgba(255,255,255,.22),transparent 40%)}
.escenario.b0{--bg1:#4aa3ff;--bg2:#b57bff}.escenario.b1{--bg1:#ff8ac6;--bg2:#ffb86b}
.escenario.b2{--bg1:#38d6c0;--bg2:#5b8cff}.escenario.b3{--bg1:#ffd166;--bg2:#ff6b9a}
.escenario.vacio .pulso{opacity:0}
.pulso{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 100%,rgba(255,255,255,.5),transparent 55%);opacity:0}
.fila{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);padding:6px 6px 2px}
.ayuda{position:absolute;inset:0;margin:auto;width:max-content;height:fit-content;z-index:3;pointer-events:none;color:#fff;text-align:center;
  font-size:clamp(15px,4.6vw,32px);text-shadow:0 3px 0 rgba(0,0,0,.35);background:rgba(43,27,77,.55);padding:.45em .9em;border-radius:22px;animation:bob 1.8s ease-in-out infinite;max-width:80%}
.ayuda.oculta{display:none}

/* ---------- personajes (cabeza = foto) ---------- */
.slot{position:relative;display:flex;align-items:flex-end;justify-content:center;touch-action:none;min-width:0;min-height:0}
.musi{position:relative;width:calc(var(--u) * 100);height:calc(var(--u) * 150);flex:none;transform-origin:50% 100%}
.suelo{position:absolute;left:calc(var(--u) * 12);top:calc(var(--u) * 132);width:calc(var(--u) * 76);height:calc(var(--u) * 14);border-radius:50%;background:rgba(0,0,0,.22)}
.cabeza{position:absolute;left:calc(var(--u) * 17);top:calc(var(--u) * 2);width:calc(var(--u) * 66);height:calc(var(--u) * 66);border-radius:50%;overflow:hidden;z-index:3;
  border:calc(var(--u) * 4) solid #fff;box-shadow:0 calc(var(--u) * 3) 0 rgba(0,0,0,.25);background:#fff;transition:filter .3s}
.cabeza img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cuerpo{position:absolute;left:calc(var(--u) * 22);top:calc(var(--u) * 64);width:calc(var(--u) * 56);height:calc(var(--u) * 62);z-index:2;
  border-radius:calc(var(--u) * 26) calc(var(--u) * 26) calc(var(--u) * 14) calc(var(--u) * 14);background:var(--c,#8c90a6);border:calc(var(--u) * 3.5) solid #2b1b4d;transition:background .3s;
  display:grid;place-items:center}
.brazo{position:absolute;top:calc(var(--u) * 72);width:calc(var(--u) * 14);height:calc(var(--u) * 42);border-radius:calc(var(--u) * 7);background:var(--c,#8c90a6);border:calc(var(--u) * 3.5) solid #2b1b4d;z-index:1;transition:background .3s;transform-origin:50% 10%}
.brazo.i{left:calc(var(--u) * 9)}.brazo.d{left:calc(var(--u) * 77)}
.pie{position:absolute;top:calc(var(--u) * 122);width:calc(var(--u) * 24);height:calc(var(--u) * 15);border-radius:calc(var(--u) * 10) calc(var(--u) * 10) calc(var(--u) * 5) calc(var(--u) * 5);background:#2b1b4d;z-index:1}
.pie.i{left:calc(var(--u) * 27)}.pie.d{left:calc(var(--u) * 49)}
.insignia{width:calc(var(--u) * 34);height:calc(var(--u) * 34);display:grid;place-items:center;pointer-events:none}
.insignia svg{width:100%;height:100%}
.mas{width:calc(var(--u) * 26);height:calc(var(--u) * 26);border-radius:50%;border:calc(var(--u) * 3) dashed rgba(255,255,255,.85);display:grid;place-items:center;color:#fff;font-size:calc(var(--u) * 20);line-height:1}
.slot:not(.activo) .cabeza{filter:grayscale(1) brightness(.78)}
.slot:not(.activo) .musi{opacity:.92}
.slot.mudo .cabeza{filter:grayscale(1) brightness(.7)}
.slot.mudo .cuerpo,.slot.mudo .brazo{background:#8c90a6}
.slot.mudo .insignia{opacity:.45}
.slot.activo:not(.mudo) .cabeza{border-color:#fff;box-shadow:0 0 0 calc(var(--u) * 3) var(--c),0 calc(var(--u) * 3) 0 rgba(0,0,0,.25)}
.slot.sobre .musi{transform:scale(1.12);filter:drop-shadow(0 0 calc(var(--u) * 10) #fff)}
.slot.sobre::after{content:"";position:absolute;inset:4%;border:4px dashed #fff;border-radius:24px;pointer-events:none;opacity:.9}
.ondas{position:absolute;left:calc(var(--u) * 12);top:calc(var(--u) * -4);width:calc(var(--u) * 76);height:calc(var(--u) * 76);pointer-events:none;display:none}
.ondas i{position:absolute;inset:0;border:calc(var(--u) * 3.5) solid var(--c);border-radius:50%;opacity:0;animation:onda 1.6s ease-out infinite}
.ondas i:nth-child(2){animation-delay:.53s}.ondas i:nth-child(3){animation-delay:1.06s}
@keyframes onda{0%{opacity:0;transform:scale(.8)}30%{opacity:.9}100%{opacity:0;transform:scale(1.45)}}
.slot.activo:not(.mudo) .ondas{display:block}
.nf{position:absolute;pointer-events:none;z-index:6;font-size:calc(var(--u) * 24);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);animation:nflota 1.5s ease-out forwards}
@keyframes nflota{0%{opacity:0;transform:translate(0,0) rotate(-10deg) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx,10px),calc(var(--u) * -90)) rotate(12deg) scale(1.1)}}

/* ---------- barra de sonidos ---------- */
.paleta{flex:none;display:grid;grid-template-rows:repeat(4,auto);gap:6px;background:rgba(20,8,60,.45);border-radius:24px;padding:8px}
.cat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:relative}
.cat-t{display:none}
.snd{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:clamp(60px,10.5vh,84px);border-radius:18px;
  background:var(--c);box-shadow:0 5px 0 rgba(0,0,0,.3);touch-action:none;transition:filter .2s,transform .1s;min-width:0}
.snd svg{width:clamp(30px,5.4vh,46px);height:clamp(30px,5.4vh,46px);pointer-events:none}
.snd b{font-size:clamp(10px,1.7vh,13px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4);pointer-events:none;line-height:1;white-space:nowrap}
.snd:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.snd.usado{filter:saturate(.35) brightness(.78)}
.snd .mini{position:absolute;right:-4px;top:-6px;width:clamp(22px,3.8vh,30px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid #fff;background:#fff;pointer-events:none}
.fantasma{position:fixed;z-index:50;pointer-events:none;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:22px;background:var(--c);box-shadow:0 10px 18px rgba(0,0,0,.4);
  display:grid;place-items:center;transform:scale(1.1) rotate(-6deg)}
.fantasma svg{width:62%;height:62%}

/* ---------- horizontal ---------- */
@media (orientation:landscape){
  #juego.activa{display:grid;grid-template-columns:minmax(0,1fr) clamp(250px,38vw,430px);grid-template-rows:auto minmax(0,1fr);gap:8px 10px}
  .top{grid-column:1/-1}
  .foto-top{width:clamp(48px,15vh,84px)}
  .titulo{font-size:clamp(18px,6vh,40px)}
  .ayuda{font-size:clamp(13px,4.4vh,28px);max-width:60%}
  .btn-c{width:clamp(40px,11vh,56px)}
  .escenario{grid-column:1;grid-row:2}
  .paleta{grid-column:2;grid-row:2;align-self:stretch;grid-template-rows:repeat(4,1fr);min-height:0}
  .snd{height:auto;min-height:0}
  .snd svg{width:clamp(24px,7.5vh,44px);height:clamp(24px,7.5vh,44px)}
  .snd b{font-size:clamp(9px,2.5vh,13px)}
}
@media (orientation:landscape){
  #hello{flex-direction:row;gap:5vw}
  .portada{width:min(34vw,64vh,300px)}
  .logo-txt{font-size:clamp(28px,min(6vw,13vh),70px)}
  .burbuja{font-size:clamp(20px,min(4vw,8.5vh),44px)}
  .big-btn{font-size:clamp(22px,min(4vw,8vh),40px)}
}
@media (orientation:landscape) and (max-height:480px){
  #juego{padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:6px 8px}
  .snd{border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
  .paleta{padding:6px;gap:4px;border-radius:18px}.cat{gap:4px}
  .escenario{border-radius:20px}
}
@media (prefers-reduced-motion:reduce){.ondas i,.ayuda,.big-btn{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<section id="hello" class="pantalla activa">
  <a class="btn-c casa irMenu irHello" href="../" aria-label="Volver al menú de juegos"><svg viewBox="0 0 100 100"><path d="M14 52 L50 18 L86 52" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 48 V84 H42 V62 H58 V84 H76 V48 L50 26 Z" fill="#fff" stroke="#2b1b4d" stroke-width="5" stroke-linejoin="round"/></svg></a>
  <div class="portada"><img id="fotoHello" alt="Alict"></div>
  <div class="hola-txt">
    <div class="logo-txt">SPRUNKI<em>ALICT</em></div>
    <div class="burbuja">HOLA <em>ALICT</em>,<br>¿CÓMO ESTÁS HOY?</div>
    <button id="start" class="big-btn">
      <svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#fff"/></svg>

</section>

<section id="juego" class="pantalla">
  <div class="top">

    <button class="btn-c" id="bBorrar" aria-label="Borrar todo"></button>
    <a class="btn-c casa irMenu" id="bCasa" href="../" aria-label="Volver al menú de juegos"><svg viewBox="0 0 100 100"><path d="M14 52 L50 18 L86 52" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 48 V84 H42 V62 H58 V84 H76 V48 L50 26 Z" fill="#fff" stroke="#2b1b4d" stroke-width="5" stroke-linejoin="round"/></svg></a>

    <div class="ayuda" id="ayuda">Toca o arrastra un sonido a un amigo</div>
  </div>
  <nav class="paleta" id="paleta"></nav>
</section>

const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = a => a[Math.floor(Math.random() * a.length)];
const bolsa = lista => {
  let cola = [], ultima = null;
  return () => {
    if (!cola.length) { cola = shuffle(lista); if (cola.length > 1 && cola[cola.length - 1] === ultima) cola.unshift(cola.pop()); }
    ultima = cola.pop(); return ultima;
  };

/* =============== Motor de sonido ===============
   Todo se genera con WebAudio (no hay archivos de audio). Todos los sonidos usan el mismo tempo,
   la misma tonalidad (Do mayor) y la misma progresión de acordes (Do – La menor – Fa – Sol),
   así que cualquier mezcla suena bien. Un ciclo = 4 compases de 16 pasos. */
const BPM = 104, PASO = 60 / BPM / 4, PASOS = 64;
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
const ACORDES = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];
const RAIZ = [36, 33, 29, 31];
const PENTA = [60, 62, 64, 67, 69, 72, 74, 76];

const AU = { ctx: null, out: null, ruido: null };
function usarAudio(ctx, out) {
  AU.ctx = ctx; AU.out = out;
  const n = ctx.sampleRate, b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  AU.ruido = b;
}
function armarMaster(ctx) {
  const entrada = ctx.createGain(), comp = ctx.createDynamicsCompressor(), sal = ctx.createGain();
  comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 5; comp.attack.value = .004; comp.release.value = .2;
  sal.gain.value = .9;
  entrada.connect(comp); comp.connect(sal); sal.connect(ctx.destination);
  return entrada;
}

// Nota con envolvente. o: a (frecuencia final), ad (duración del deslizamiento), fil/ff/q (filtro), atk, sus/rel (sostenida), vib
function nota(tipo, f, t, dur, vol, o = {}) {
  const c = AU.ctx, os = c.createOscillator(), g = c.createGain();
  os.type = tipo; os.frequency.setValueAtTime(f, t);
  if (o.a) os.frequency.exponentialRampToValueAtTime(Math.max(20, o.a), t + (o.ad || dur));
  if (o.vib) {
    const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib[0]; lg.gain.value = f * o.vib[1];

function arrancar() {
  if (MOT.corriendo || !audio()) return;
  MOT.corriendo = true; MOT.sig = 0; MOT.t = MOT.ctx.currentTime + .1; MOT.cola = [];
  MOT.timer = setInterval(planificar, 25); planificar();
  if (!visRaf) visRaf = requestAnimationFrame(visual);
}
function parar() { MOT.corriendo = false; clearInterval(MOT.timer); MOT.cola = []; }
function silenciarBus(i) {
  if (!MOT.ctx) return; const g = MOT.buses[i].gain, t = MOT.ctx.currentTime;
  g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0, t + .06); g.setValueAtTime(1, t + .5);
}
const activos = () => MOT.slots.filter(Boolean).length;

/* =============== Personajes =============== */
const fila = $('#fila'), esc = $('#escenario'), pulso = $('#pulso'), ayuda = $('#ayuda'), paleta = $('#paleta');
const slotEls = [];
for (let i = 0; i < NSLOT; i++) {
  const d = document.createElement('div'); d.className = 'slot'; d.dataset.i = i;
  d.innerHTML = `<div class="musi"><div class="suelo"></div><div class="ondas"><i></i><i></i><i></i></div>
    <i class="brazo i"></i><i class="brazo d"></i><i class="pie i"></i><i class="pie d"></i>
    <div class="cuerpo"><div class="mas">+</div><div class="insignia" hidden></div></div>
    <div class="cabeza"><img alt="" src="${CARAS[i % CARAS.length]}"></div></div>`;
  fila.appendChild(d); slotEls.push(d);
}
function ajustarTam() {
  slotEls.forEach(d => { const r = d.getBoundingClientRect(); d.style.setProperty('--u', Math.max(.4, Math.min(r.width / 104, r.height / 152)) + 'px'); });
}
addEventListener('resize', () => requestAnimationFrame(ajustarTam));
new ResizeObserver(ajustarTam).observe(fila);

function pintarSlot(i) {
  const d = slotEls[i], k = MOT.slots[i];
  d.classList.toggle('activo', !!k); d.classList.toggle('mudo', !!k && MOT.mudo[i]);
  const ins = d.querySelector('.insignia'), mas = d.querySelector('.mas');
  if (k) { d.style.setProperty('--c', SONIDOS[k].c); ins.innerHTML = ICONOS[k]; ins.hidden = false; mas.hidden = true; }
  else { d.style.removeProperty('--c'); ins.innerHTML = ''; ins.hidden = true; mas.hidden = false; }
}
function pintarPaleta() {
  paleta.querySelectorAll('.snd').forEach(b => {
    const i = MOT.slots.indexOf(b.dataset.k), m = b.querySelector('.mini');
    b.classList.toggle('usado', i >= 0);
    if (i >= 0) { if (!m) { const im = document.createElement('img'); im.className = 'mini'; im.alt = ''; b.appendChild(im); } b.querySelector('.mini').src = CARAS[i % CARAS.length]; }
    else if (m) m.remove();
  });
  esc.classList.toggle('vacio', !activos());
  ayuda.classList.toggle('oculta', activos() > 0);
}
for (let c = 0; c < 4; c++) {
  const f = document.createElement('div'); f.className = 'cat';
  f.innerHTML = ORDEN[c].map(k => `<button class="snd" data-k="${k}" style="--c:${SONIDOS[k].c}" aria-label="${SONIDOS[k].n}">${ICONOS[k]}<b>${SONIDOS[k].n}</b></button>`).join('');
  paleta.appendChild(f);
}
$('#bAzar').innerHTML = `<svg viewBox="0 0 100 100"><rect x="16" y="16" width="68" height="68" rx="16" fill="#fff" ${ln(6)}/><circle cx="35" cy="35" r="7" fill="${INK}"/><circle cx="65" cy="35" r="7" fill="${INK}"/><circle cx="50" cy="50" r="7" fill="${INK}"/><circle cx="35" cy="65" r="7" fill="${INK}"/><circle cx="65" cy="65" r="7" fill="${INK}"/></svg>`;
$('#bBorrar').innerHTML = `<svg viewBox="0 0 100 100"><path d="M24 30 H76 L70 88 H30 Z" fill="#9ad0ff" ${ln(6)}/><path d="M16 30 H84 M40 30 V18 H60 V30 M42 46 V72 M58 46 V72" ${ln(6)} fill="none"/></svg>`;

/* =============== Felicitaciones (todas dicen el nombre) =============== */
const frNuevo = bolsa([`¡Qué buena música, ${NOMBRE}!`, `¡Eso suena genial, ${NOMBRE}!`, `¡Eres un artista, ${NOMBRE}!`, `¡Muy bien, ${NOMBRE}! ¡Sigue así!`,
  `¡Wow, ${NOMBRE}! ¡Qué ritmo!`, `¡Qué bien suena, ${NOMBRE}!`, `¡Bravo, ${NOMBRE}!`, `¡Eres un gran músico, ${NOMBRE}!`, `¡Me encanta tu música, ${NOMBRE}!`]);
const frBanda = bolsa([`¡Increíble, ${NOMBRE}! ¡Armaste toda la banda!`, `¡Wow, ${NOMBRE}! ¡La banda está completa!`, `¡Eres el mejor director de banda, ${NOMBRE}!`,
  `¡Fiesta, fiesta, ${NOMBRE}! ¡Toda la banda toca contigo!`]);
const frAzar = bolsa([`¡Mezcla sorpresa para ti, ${NOMBRE}!`, `¡Mira qué sorpresa, ${NOMBRE}!`, `¡A bailar, ${NOMBRE}!`]);
let nuevos = 0, bandaFeliz = false;

/* =============== Acciones =============== */
function ponerSonido(k, i, desde = -1) {
  audio();
  const j = MOT.slots.indexOf(k);
  const otro = MOT.slots[i];
  if (desde >= 0) {                       // mover o intercambiar entre personajes
    MOT.slots[desde] = otro && otro !== k ? otro : null; MOT.mudo[desde] = false;
    if (MOT.slots[desde]) { pintarSlot(desde); } else { silenciarBus(desde); pintarSlot(desde); }
  } else if (j >= 0 && j !== i) { MOT.slots[j] = null; MOT.mudo[j] = false; silenciarBus(j); pintarSlot(j); }
  if (desde < 0 && otro && otro !== k) silenciarBus(i);
  MOT.slots[i] = k; MOT.mudo[i] = false; pintarSlot(i);
  if (desde >= 0 && MOT.slots[desde]) silenciarBus(desde);
  silenciarBus(i);
  rebotar(i, true);
  chispasEn(i, SONIDOS[k].c, 14);
  if (!MOT.corriendo) arrancar();
  pintarPaleta();
  if (desde < 0 && j < 0) alAgregar();
  revisarBanda();
}
function alAgregar() {
  nuevos++;
  if (nuevos === 1 || nuevos % 3 === 0) say(frNuevo());
}
function revisarBanda() {
  if (activos() === NSLOT && !bandaFeliz) {
    bandaFeliz = true; setTimeout(() => { say(frBanda()); fuegos(7); slotEls.forEach((_, i) => setTimeout(() => rebotar(i, true), i * 70)); }, 500);
  } else if (activos() < NSLOT) bandaFeliz = false;
}
function quitar(i) {
  if (!MOT.slots[i]) return;
  MOT.slots[i] = null; MOT.mudo[i] = false; silenciarBus(i); pintarSlot(i); pintarPaleta();
  if (!activos()) setTimeout(() => { if (!activos()) { parar(); esc.classList.add('vacio'); } }, 400);
}
function alternarMudo(i) {
  if (!MOT.slots[i]) return;
  MOT.mudo[i] = !MOT.mudo[i]; if (MOT.mudo[i]) silenciarBus(i); pintarSlot(i); rebotar(i, true);
}
function tocarIcono(k) {
  audio();
  const j = MOT.slots.indexOf(k);
  if (j >= 0) { quitar(j); return; }
  let i = MOT.slots.findIndex(x => !x);
  if (i < 0) { i = MOT.rr % NSLOT; MOT.rr++; }
  ponerSonido(k, i);
}
function limpiar() {
  for (let i = 0; i < NSLOT; i++) { if (MOT.slots[i]) { silenciarBus(i); } MOT.slots[i] = null; MOT.mudo[i] = false; pintarSlot(i); }
  pintarPaleta(); setTimeout(() => { if (!activos()) parar(); }, 300); bandaFeliz = false; nuevos = 0;
}
function sorpresa() {
  audio(); limpiar();
  const pick = (c, n) => shuffle(ORDEN[c]).slice(0, n);
  const lista = shuffle(pick(0, 2).concat(pick(1, 1), pick(2, 2), pick(3, 1 + Math.round(Math.random()))));
  const lugares = shuffle([...Array(NSLOT).keys()]);
  lista.forEach((k, n) => setTimeout(() => ponerSonido(k, lugares[n]), 160 + n * 220));
  setTimeout(() => say(frAzar()), 200);
}

/* =============== Animaciones y chispas =============== */
function rebotar(i, fuerte) {
  const k = MOT.slots[i], m = slotEls[i].querySelector('.musi'); if (!m || !m.animate) return;
  const cat = k ? SONIDOS[k].cat : 0, a = fuerte ? 1.5 : 1;
  const kf = [
    [{ transform: 'translateY(0) scale(1,1)' }, { transform: `translateY(${-5 * a}%) scale(${1 - .04 * a},${1 + .06 * a})`, offset: .4 }, { transform: 'translateY(0) scale(1,1)' }],
    [{ transform: 'rotate(0)' }, { transform: `rotate(${-7 * a}deg) translateY(${-3 * a}%)`, offset: .35 }, { transform: `rotate(${6 * a}deg)`, offset: .7 }, { transform: 'rotate(0)' }],
    [{ transform: 'translateX(0) rotate(0)' }, { transform: `translateX(${3 * a}%) rotate(${4 * a}deg)`, offset: .5 }, { transform: 'translateX(0) rotate(0)' }],
    [{ transform: 'scale(1)' }, { transform: `scale(${1 + .07 * a}) translateY(${-3 * a}%)`, offset: .4 }, { transform: 'scale(1)' }],
  ][cat];
  m.animate(kf, { duration: 300, easing: 'ease-out' });
}
function chispasEn(i, color, n) { const r = slotEls[i].getBoundingClientRect(); chispas(r.left + r.width / 2, r.top + r.height * .35, color, n); }
function notaFlota(i) {
  const d = slotEls[i], n = document.createElement('div'); n.className = 'nf'; n.textContent = rnd(['♪', '♫', '♬']);
  n.style.left = (30 + Math.random() * 40) + '%'; n.style.top = '8%'; n.style.setProperty('--dx', Math.round(Math.random() * 40 - 20) + 'px');
  d.appendChild(n); setTimeout(() => n.remove(), 1600);
}

/* =============== Reloj visual (sincronizado con el sonido) =============== */
let visRaf = 0;
function visual() {
  visRaf = 0;
  const c = MOT.ctx; if (!c || !MOT.corriendo) return;
  const ahora = c.currentTime - (c.outputLatency || c.baseLatency || 0);
  while (MOT.cola.length && MOT.cola[0].t <= ahora) {
    const { s } = MOT.cola.shift();
    if (s % 4 === 0) {
      pulso.animate([{ opacity: .55 }, { opacity: 0 }], { duration: 380 });
      for (let i = 0; i < NSLOT; i++) if (MOT.slots[i] && !MOT.mudo[i]) rebotar(i, s % 16 === 0);
    }
    if (s % 16 === 0) {
      esc.className = esc.className.replace(/\bb[0-3]\b/, 'b' + (s >> 4));
      for (let i = 0; i < NSLOT; i++) if (MOT.slots[i] && !MOT.mudo[i] && Math.random() < .55) notaFlota(i);
    }
  }
  visRaf = requestAnimationFrame(visual);
}

/* =============== Arrastrar y soltar (o tocar) =============== */
let arr = null, ghost = null;
const slotEn = (x, y) => { for (let i = 0; i < NSLOT; i++) { const r = slotEls[i].getBoundingClientRect(); if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return i; } return -1; };
function marcarSobre(i) { slotEls.forEach((d, j) => d.classList.toggle('sobre', j === i)); }
function empezar(e, k, desde) {
  audio();
  arr = { k, desde, x0: e.clientX, y0: e.clientY, mov: false, id: e.pointerId };
  addEventListener('pointermove', mover); addEventListener('pointerup', soltar); addEventListener('pointercancel', soltar);
}
function mover(e) {
  if (!arr || e.pointerId !== arr.id) return;
  if (!arr.mov && Math.hypot(e.clientX - arr.x0, e.clientY - arr.y0) > 10) {
    arr.mov = true; ghost = document.createElement('div'); ghost.className = 'fantasma'; ghost.style.setProperty('--c', SONIDOS[arr.k].c); ghost.innerHTML = ICONOS[arr.k]; document.body.appendChild(ghost);
  }
  if (arr.mov) { ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; marcarSobre(slotEn(e.clientX, e.clientY)); }
}
function soltar(e) {
  if (!arr || e.pointerId !== arr.id) return;
  removeEventListener('pointermove', mover); removeEventListener('pointerup', soltar); removeEventListener('pointercancel', soltar);
  const a = arr; arr = null; marcarSobre(-1); if (ghost) { ghost.remove(); ghost = null; }
  if (e.type === 'pointercancel') return;
  if (!a.mov) { if (a.desde >= 0) alternarMudo(a.desde); else tocarIcono(a.k); return; }
  const i = slotEn(e.clientX, e.clientY);
  if (i >= 0) { if (i !== a.desde) ponerSonido(a.k, i, a.desde); }
  else if (a.desde >= 0) quitar(a.desde);
}
paleta.addEventListener('pointerdown', e => { const b = e.target.closest('.snd'); if (b) { e.preventDefault(); empezar(e, b.dataset.k, -1); } });
fila.addEventListener('pointerdown', e => { const s = e.target.closest('.slot'); if (!s) return; const i = +s.dataset.i; if (MOT.slots[i]) { e.preventDefault(); empezar(e, MOT.slots[i], i); } });
$('#bAzar').addEventListener('click', sorpresa);
$('#bBorrar').addEventListener('click', () => { audio(); limpiar(); });

/* =============== Pantallas y saludo =============== */
$('#fotoHello').src = LOGO; $('#fotoTop').src = CARAS[1];
const ver = id => document.querySelectorAll('.pantalla').forEach(p => p.classList.toggle('activa', p.id === id));
let saludado = false, saludando = false, despuesSaludo = null, saludoId = 0;
function saludar() {
  const mio = ++saludoId;
  const fin = () => { if (mio !== saludoId) return; saludando = false; const f = despuesSaludo; despuesSaludo = null; f && f(); };
  say(`Hola ${NOMBRE}, ¿cómo estás hoy?`, { onstart: () => { if (mio === saludoId) { saludado = true; saludando = true; } }, onend: fin, onerror: fin });
}
$('#start').addEventListener('click', () => {
  audio();
  const entrar = () => { ver('juego'); requestAnimationFrame(ajustarTam); setTimeout(() => say(`¿Qué música quieres hacer, ${NOMBRE}?`), 250); };
  if (saludando) despuesSaludo = entrar;
  else if (saludado) entrar();
  else { despuesSaludo = () => { saludado = true; entrar(); }; saludar(); }
});
addEventListener('load', () => setTimeout(() => { if (!saludado) saludar(); }, 400));
const TOQUES = ['pointerup', 'touchend', 'mouseup', 'click', 'keydown'];
function primerToque(e) {
  if (saludado) { TOQUES.forEach(t => removeEventListener(t, primerToque, true)); return; }
  if (e.target.closest && e.target.closest('#start,.irMenu')) return;
  if (!$('#hello').classList.contains('activa')) return;
  TOQUES.forEach(t => removeEventListener(t, primerToque, true)); saludar();
}
TOQUES.forEach(t => addEventListener(t, primerToque, true));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { callar(); if (MOT.ctx && MOT.ctx.state === 'running') MOT.ctx.suspend(); }
  else if (MOT.ctx && MOT.corriendo) { MOT.ctx.resume(); MOT.t = Math.max(MOT.t, MOT.ctx.currentTime + .05); }
});
pintarPaleta(); ajustarTam();
/* Botón de casa: vuelve al menú de juegos. Si viene del menú de Didácticos Alict (?m=1): directo a la música, sin saludo, y la casa lo regresa a Didácticos */
document.body.classList.add('m1');
if (!/^https?:/.test(location.protocol)) document.querySelectorAll('.irMenu').forEach(e => e.hidden = true);
document.querySelectorAll('.irMenu').forEach(a => a.addEventListener('click', () => { callar(); parar(); }));
if (/[?&]m=1/.test(location.search)) {
  $('#bCasa').href = '../didacticos/'; $('#bCasa').setAttribute('aria-label', 'Volver a Didácticos Alict'); saludado = true;
  ver('juego'); requestAnimationFrame(ajustarTam);
}

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && document.querySelector('link[rel=manifest]'))
  navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
})();
</script>
</body>
