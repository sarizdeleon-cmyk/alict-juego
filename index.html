<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a0f6b">
<title>Aprende con Alict</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alict">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;
  font-family:ui-rounded,"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:800;color:#2b1b4d}
body{background:
  radial-gradient(circle at 18% 8%,#7b3fe4 0,transparent 45%),
  radial-gradient(circle at 88% 92%,#ff5fa2 0,transparent 40%),
  linear-gradient(160deg,#2a0f6b,#4b1d99 60%,#6a2bb8)}
#dots-bg{position:fixed;inset:0;pointer-events:none;opacity:.22;
  background-image:radial-gradient(#fff 1.3px,transparent 1.8px),radial-gradient(#fff 1px,transparent 1.5px);
  background-size:64px 64px,64px 64px;background-position:0 0,32px 32px}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:14px;
  padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.screen.active{display:flex;animation:fade .35s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-22px) scale(1.08)}60%{transform:translateY(0) scale(.96)}80%{transform:translateY(-8px)}}
@keyframes rise{0%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(22px,-62vh) rotate(4deg)}100%{transform:translate(-12px,-130vh) rotate(-3deg)}}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

button{font:inherit;color:inherit;border:0;cursor:pointer}
svg{display:block;overflow:visible}

/* ---------- saludo ---------- */
#hello{justify-content:center;gap:3vh;text-align:center}
/* ---------- caritas que hablan ---------- */
@keyframes talk{0%,100%{transform:scale(1,1) rotate(0)}20%{transform:scale(1.06,.94) rotate(-3deg)}45%{transform:scale(.96,1.06) rotate(2deg)}70%{transform:scale(1.05,.95) rotate(3deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,214,64,0)}50%{box-shadow:0 0 0 12px rgba(255,214,64,.6)}}
@keyframes wave{0%{opacity:0;transform:scale(.7)}35%{opacity:1}100%{opacity:0;transform:scale(1.22)}}
.cara{position:relative;flex:none;border-radius:50%;padding:0;background:none;display:block;aspect-ratio:1}
.cara .foto{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid #fff;
  box-shadow:0 6px 0 rgba(0,0,0,.28);background:#fff;pointer-events:none}
.cara .ondas{position:absolute;inset:-6px;pointer-events:none}
.cara .ondas i{position:absolute;inset:0;border:5px solid rgba(255,214,64,.95);border-radius:50%;opacity:0}
body.habla .screen.active .cara{animation:talk .34s ease-in-out infinite,glow .68s ease-in-out infinite}
body.habla .screen.active .cara .ondas i{animation:wave 1.1s ease-out infinite}
body.habla .screen.active .cara .ondas i:nth-child(2){animation-delay:.36s}
body.habla .screen.active .cara .ondas i:nth-child(3){animation-delay:.72s}
.cara.grande{width:min(58vw,32vh,300px)}
.cara.grande .foto{border-width:8px}
.cara.logo{padding:9px;background:conic-gradient(#ff5a5a,#ffd43b,#51cf66,#4dabf7,#cc5de8,#ff5a5a);box-shadow:0 10px 0 rgba(0,0,0,.25)}
.cara.logo .foto{box-shadow:none}
.cara.mini{--mini:clamp(96px,27vw,132px);width:var(--mini);height:var(--mini)}
.cara .alt{position:absolute;right:-6px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:#efe6ff;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.cara .alt svg{width:18px;height:18px}
button.cara:active{transform:scale(.94)}
.burbuja{position:relative;background:#fff;color:#2b1b4d;border-radius:30px;padding:.5em .9em;box-shadow:0 8px 0 rgba(0,0,0,.25);
  font-size:clamp(26px,7.4vw,56px);line-height:1.12;text-align:center;text-wrap:balance;max-width:900px}
.burbuja em{font-style:normal;color:#e63e83}
.burbuja::before{content:"";position:absolute;left:50%;top:-12px;width:28px;height:28px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:6px 0 0 0}
.menu-head{display:flex;align-items:center;gap:20px;width:100%;max-width:1000px;margin-top:1vh}
.burbuja.lado{flex:1;font-size:clamp(22px,6vw,44px);padding:.5em .8em}
.burbuja.lado::before{left:-10px;top:50%;transform:translateY(-50%) rotate(45deg);border-radius:0 0 0 6px}
@keyframes brote{0%{transform:scale(.1) rotate(-20deg);opacity:0}22%{transform:scale(1.15) rotate(6deg);opacity:1}38%{transform:scale(1) rotate(-4deg)}80%{transform:scale(1.06) rotate(4deg);opacity:1}100%{transform:scale(.8) rotate(0);opacity:0}}
.brote{position:fixed;z-index:25;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;animation:brote 2.3s ease-in-out forwards}
.brote img{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.28)}
.brote b{background:#ffd43b;color:#2b1b4d;border-radius:999px;padding:2px 12px;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.25);white-space:nowrap}
.hello-text{color:#fff;font-size:clamp(30px,9vw,64px);line-height:1.12;letter-spacing:.5px;
  text-shadow:0 4px 0 rgba(0,0,0,.28);max-width:900px}
.hello-text em{font-style:normal;color:#ffd43b}
.big-btn{background:linear-gradient(#5be37d,#2fbf56);color:#fff;font-size:clamp(24px,6.5vw,40px);
  padding:.55em 1.3em;border-radius:999px;box-shadow:0 8px 0 #1c8a3b,0 14px 24px rgba(0,0,0,.3);
  text-shadow:0 2px 0 rgba(0,0,0,.2);display:flex;align-items:center;gap:.5em;animation:wiggle 1.6s ease-in-out infinite}
.big-btn:active{transform:translateY(6px);box-shadow:0 2px 0 #1c8a3b}
.big-btn svg{width:1em;height:1em}

/* ---------- menú ---------- */
#menu{gap:2.5vh}
.title{color:#fff;font-size:clamp(26px,7.5vw,52px);text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.28);margin:1vh 0 0}
.modes{flex:1;min-height:0;width:100%;max-width:1000px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:14px;align-content:center;padding-bottom:6px}
.mode{min-height:0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 6px 12px;border-radius:30px;color:#fff;text-align:center;
  box-shadow:0 8px 0 rgba(0,0,0,.28),0 14px 24px rgba(0,0,0,.25);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.mode:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.mode:nth-child(1){background:linear-gradient(135deg,#ff7aa8,#e63e83);animation-delay:.05s}
.mode:nth-child(2){background:linear-gradient(135deg,#5bb6ff,#2a76e0);animation-delay:.15s}
.mode:nth-child(3){background:linear-gradient(135deg,#ffb347,#f2711c);animation-delay:.25s}
.mode:nth-child(4){background:linear-gradient(135deg,#3ee0c4,#12a58f);animation-delay:.35s}
.mode:nth-child(5){background:linear-gradient(135deg,#b28dff,#6c3fd1);animation-delay:.45s}
.mode:nth-child(6){background:linear-gradient(135deg,#8ee06a,#3a9d23);animation-delay:.55s}
.mode svg{flex:1 1 0;min-height:0;width:100%;animation:bob 2s ease-in-out infinite}
.mode:nth-child(2n) svg{animation-delay:.4s}.mode:nth-child(3n) svg{animation-delay:.8s}
.mode b{display:block;font-size:clamp(20px,5.8vw,34px);text-shadow:0 3px 0 rgba(0,0,0,.25);line-height:1}
.mode small{display:block;font-size:clamp(12px,3.3vw,18px);opacity:.92;margin-top:.3em;font-weight:700}

/* ---------- juego ---------- */
#game{gap:12px}
.hud{width:100%;max-width:1000px;display:flex;align-items:center;gap:10px}
.icon{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.icon svg{width:28px;height:28px}
.dots{flex:1;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.28);transition:.3s}
.dots i.done{background:#5be37d;transform:scale(1.1)}
.dots i.now{background:#ffd43b;transform:scale(1.35)}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);border-radius:999px;padding:6px 14px 6px 8px;font-size:24px;flex:none}
.pill svg{width:30px;height:30px}
.pill.bump{animation:jump .5s}
.card{width:100%;max-width:1000px;min-height:124px;background:#fff;border-radius:30px;padding:12px 20px 12px 14px;display:flex;align-items:center;gap:14px;
  box-shadow:0 8px 0 rgba(0,0,0,.25);transition:background .25s}
.card #qtext{flex:1;text-align:center;text-wrap:balance;font-size:clamp(26px,7.2vw,50px);line-height:1.15}
.card.ok{background:linear-gradient(135deg,#3ddc84,#1fb866);color:#fff;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.card.ok #qtext{font-size:clamp(20px,5.2vw,40px);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.card.ok #qtext em{font-style:normal;color:#fff176}
.card.bad{animation:shake .5s}
.options{flex:1;min-height:0;width:100%;max-width:760px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;align-content:center;padding-bottom:6px}
.tile{position:relative;min-height:0;min-width:0;border-radius:32px;background:linear-gradient(#fffaf0,#ffeec9);box-shadow:0 8px 0 rgba(0,0,0,.28);
  display:flex;align-items:center;justify-content:center;padding:12px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--d,0ms)}
.tile svg{height:100%;width:100%;animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--d,0ms) * 4)}
.tile:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.tile.shake{animation:shake .5s}
.tile.wrong{filter:grayscale(.9) brightness(.92);opacity:.5;box-shadow:0 3px 0 rgba(0,0,0,.2);transform:translateY(4px)}
.tile.wrong svg{animation:none}
.tile.right{background:linear-gradient(#e6ffe9,#b9f5c4);outline:7px solid #3ddc84;animation:jump .8s ease both}
.options.cuerpo{display:flex;align-items:center;justify-content:center;max-width:520px;padding:10px 10px 6px;
  background:linear-gradient(#fffaf0,#ffeec9);border-radius:32px;box-shadow:0 8px 0 rgba(0,0,0,.28)}
.options.cuerpo svg{height:100%;width:auto;max-width:100%}
.parte{cursor:pointer}
.parte.wrong{opacity:.4}
.parte.right{transform-box:fill-box;transform-origin:center;animation:latido .5s ease-in-out 4;filter:drop-shadow(0 0 5px #ffd43b) drop-shadow(0 0 10px #ffb300)}
@keyframes desaparece{0%{transform:scale(1) rotate(0);opacity:1}35%{transform:scale(1.2) rotate(-8deg);opacity:1}100%{transform:scale(0) rotate(25deg);opacity:0}}
@keyframes vuelve{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes puf{0%{transform:scale(.2);opacity:.95}70%{opacity:.9}100%{transform:scale(1.7);opacity:0}}
.parte.quitada{pointer-events:none}
.parte.quitada>*,.parte.vuelve>*{transform-box:fill-box;transform-origin:center}
.parte.quitada>*{animation:desaparece .55s ease-in forwards}
.parte.vuelve>*{animation:vuelve .6s cubic-bezier(.2,1.4,.4,1) both}
.puf{transform-box:fill-box;transform-origin:center;animation:puf .8s ease-out forwards}
.puf circle{fill:#fff;stroke:#c9b6f5;stroke-width:2.5}
.xm{pointer-events:none;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.xmark{position:absolute;top:8px;right:8px;width:38px;height:38px}
.xmark svg{animation:none;width:100%;height:100%}

/* ---------- final ---------- */
#end{justify-content:center;gap:3vh;text-align:center}
.stats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.stat{background:#fff;border-radius:26px;padding:12px 26px;font-size:clamp(24px,6vw,38px);display:flex;align-items:center;gap:10px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.stat svg{width:1.3em;height:1.3em}
.end-btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.big-btn.alt{background:linear-gradient(#ffd24d,#f5a623);box-shadow:0 8px 0 #b8741a,0 14px 24px rgba(0,0,0,.3);animation:none}

/* ---------- efectos ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#balloons{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.balloon{position:absolute;bottom:-18vh;border-radius:50% 50% 50% 50%/55% 55% 45% 45%;
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.75) 0,rgba(255,255,255,0) 32%),var(--c);
  box-shadow:inset -8px -10px 18px rgba(0,0,0,.18);animation:rise linear forwards}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:60px;background:rgba(255,255,255,.7);transform:translateX(-50%)}
.balloon.cara-globo{background:none;box-shadow:none;border-radius:50%}
.balloon.cara-globo::before{display:none}
.cara-globo img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.balloon::before{content:"";position:absolute;left:50%;top:97%;width:12px;height:10px;background:var(--c);
  transform:translateX(-50%);clip-path:polygon(50% 0,100% 100%,0 100%);filter:brightness(.85)}

@media (orientation:landscape){
  .modes{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:10px}
  .options{max-width:1000px;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr}
  .card{min-height:70px;padding:8px 14px 8px 20px}
  .cara.mini{--mini:clamp(66px,19vh,124px)}
  .cara.grande{width:min(28vw,33vh,240px)}
  #hello,#end{gap:1.8vh}
  .mode b{font-size:clamp(16px,5.2vh,28px)}
  .mode small{font-size:clamp(11px,3.3vh,16px)}
  .burbuja.lado{font-size:clamp(18px,5.6vh,34px)}
  .cara.logo{padding:7px}
  .burbuja{font-size:clamp(20px,6.2vh,44px)}
  .big-btn{font-size:clamp(18px,5.4vh,32px);padding:.4em 1.1em}
  .stat{font-size:clamp(18px,5.2vh,30px);padding:6px 20px}
  .icon{width:46px;height:46px}
  #game{gap:8px}
}
/* ---------- pestañas del menú ---------- */
.tabs{display:flex;gap:10px;justify-content:center;width:100%;max-width:1000px}
.tab{flex:1;max-width:360px;padding:.4em .6em;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;font-size:clamp(17px,4.8vw,28px);
  text-shadow:0 2px 0 rgba(0,0,0,.2);box-shadow:0 5px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;gap:.4em}
.tab.on{background:linear-gradient(#ffe066,#ffc21a);color:#4b1d99;text-shadow:none;box-shadow:0 5px 0 #b8861a}
.tab:active{transform:translateY(4px)}
.tab svg{width:1.2em;height:1.2em}
.modes[hidden]{display:none!important}

/* ---------- pantalla de minijuegos ---------- */
#juego{gap:10px}
.card #jtext{flex:1;text-align:center;text-wrap:balance;font-size:clamp(22px,6vw,44px);line-height:1.15}
.card.ok #jtext{font-size:clamp(20px,5.2vw,40px);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.card.ok #jtext em{font-style:normal;color:#fff176}
.stage{position:relative;flex:1;min-height:0;width:100%;max-width:1000px;border-radius:32px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.28);
  touch-action:none;background:#8ed8ff;-webkit-user-drag:none}
.stage *{-webkit-user-drag:none}
.cara.flota{position:absolute;margin:0}
.cara.flota .foto{border-width:5px}
.cuenta{position:absolute;left:12px;top:12px;z-index:5;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);border-radius:999px;
  padding:4px 14px 4px 8px;font-size:clamp(18px,4.6vw,26px);pointer-events:none;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.cuenta svg{width:1.4em;height:1.4em}
.cuenta span{opacity:.6;font-size:.8em}
.cuenta.bump{animation:jump .4s}
@keyframes latido2{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.cara.flota.llama{animation:latido2 .5s ease-in-out 3}

/* --- ayuda a Alict: una línea --- */
.stage.linea{background:linear-gradient(#a8e6ff 0,#d6f5ff 38%,#a6e68a 62%,#78d160 100%)}
.stage .deco{position:absolute;pointer-events:none;opacity:.95}
.stage .deco svg{width:100%;height:100%}
.trazo{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:2}
.guia{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.guia path{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-dasharray:1 20;opacity:.95;animation:marcha 1.1s linear infinite}
@keyframes marcha{to{stroke-dashoffset:-21}}
.destino{position:absolute;pointer-events:none;z-index:1;animation:bob 2.4s ease-in-out infinite}
.destino svg{width:100%;height:100%}
.destino.llega{animation:jump .8s ease both}
.dedo{position:absolute;pointer-events:none;z-index:4;opacity:0;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))}
.dedo svg{width:100%;height:100%}
.stage .cara.flota{z-index:3;pointer-events:none}

/* --- globos, burbujas y estrellas --- */
.stage.globos[data-tema=globos]{background:linear-gradient(#4fb3ff,#c7ecff)}
.stage.globos[data-tema=burbujas]{background:linear-gradient(#1fc0d8,#0b6aa0)}
.stage.globos[data-tema=estrellas]{background:radial-gradient(circle at 20% 15%,#6f3fd1 0,transparent 55%),linear-gradient(#150f5c,#4a2391)}
.glo{position:absolute;left:0;top:0;cursor:pointer;animation:sube linear forwards;z-index:2}
@keyframes sube{from{transform:translate(0,0)}to{transform:translate(var(--dx,0px),calc(var(--h) * -1))}}
@keyframes balanceo{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes estalla{0%{transform:scale(1);opacity:1}35%{transform:scale(1.3);opacity:1}100%{transform:scale(1.9);opacity:0}}
.glo .in{position:relative;width:100%;height:100%;animation:balanceo 2.2s ease-in-out infinite;transform-origin:50% 90%}
.glo svg{width:100%;height:100%;pointer-events:none}
.glo .cf{position:absolute;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.2);pointer-events:none;background:#fff}
.glo.pop{animation-play-state:paused;pointer-events:none}
.glo.pop .in{animation:estalla .24s ease-out forwards}

/* --- corre --- */
.stage.corre[data-tema=parque]{background:linear-gradient(#a6e68a,#5fc24a)}
.stage.corre[data-tema=espacio]{background:radial-gradient(circle at 80% 20%,#7b3fe4 0,transparent 50%),linear-gradient(#150f5c,#3b1f8c)}
.stage.corre[data-tema=fiesta]{background:linear-gradient(#ff9ec7,#ffd36b)}
.lienzo{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

/* --- pintar y dibujar --- */
.stage.pintar,.stage.dibujar{display:flex;flex-direction:column;background:linear-gradient(#fff8e7,#ffe9c2);padding:10px;gap:10px;touch-action:manipulation}
.lamina{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:24px;box-shadow:inset 0 0 0 4px #f0e3c4;overflow:hidden}
.lamina svg{width:100%;height:100%}
.lamina canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.zona{cursor:pointer;transform-box:fill-box;transform-origin:center}
.zona.pintada{animation:pintada .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pintada{0%{transform:scale(.9)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
.panel{display:flex;flex-direction:column;gap:6px;flex:none}
.paleta{display:flex;gap:clamp(5px,1.6vw,12px);justify-content:center;flex:none;padding:4px 0 8px}
.col{flex:none;width:clamp(34px,9.6vw,58px);aspect-ratio:1;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .15s}
.col.sel{transform:translateY(-6px) scale(1.16);box-shadow:0 0 0 4px #ffd43b,0 8px 0 rgba(0,0,0,.25)}
.herr{display:flex;gap:clamp(6px,2vw,14px);justify-content:center;flex:none;padding-bottom:4px}
.hb{flex:none;width:clamp(44px,11.5vw,62px);aspect-ratio:1;border-radius:18px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25);display:grid;place-items:center}
.hb svg{width:62%;height:62%}
.hb.sel{outline:4px solid #ffd43b}
.hb:active{transform:translateY(3px)}
.hb.listo{background:linear-gradient(#5be37d,#2fbf56);width:clamp(64px,18vw,96px);margin-left:6px}
.hb.listo svg{width:56%;height:56%}

@media (orientation:landscape){
  .stage.pintar,.stage.dibujar{flex-direction:row}
  .panel{justify-content:center;align-items:center;width:clamp(150px,26%,270px)}
  .panel .paleta{flex-wrap:wrap;gap:clamp(6px,1.4vh,12px);padding:2px}
  .panel .herr{flex-wrap:wrap;gap:clamp(6px,1.4vh,12px);padding:0}
  .hb.listo{margin-left:0}
  .tab{font-size:clamp(14px,4.6vh,24px);padding:.3em .6em}
  .tabs{gap:8px}
  .stage{border-radius:26px}
  .col{width:clamp(30px,8vh,50px)}
  .hb{width:clamp(38px,10vh,56px)}
  .hb.listo{width:clamp(56px,14vh,84px)}
  .stage.pintar,.stage.dibujar{padding:8px;gap:6px}
  #juego{gap:8px}
}

/* teléfono acostado: todo más compacto */
@media (orientation:landscape) and (max-height:560px){
  #juego .cara.mini{--mini:clamp(48px,15vh,66px)}
  #juego .card{min-height:0;padding:6px 14px 6px 10px}
  #juego .card #jtext{font-size:clamp(16px,5.6vh,26px)}
  #juego .card.ok #jtext{font-size:clamp(15px,5vh,24px)}
  #juego .hud{gap:8px}
}

@media (prefers-reduced-motion:reduce){.tile svg,.trio svg,.mode svg,.big-btn{animation:none}}
</style>
</head>
<body>
<div id="dots-bg"></div>
<div id="app">

  <!-- Saludo -->
  <section id="hello" class="screen active">
    <div class="cara grande logo" id="caraHello"><span class="ondas"><i></i><i></i><i></i></span><img class="foto" alt="Logo"></div>
    <div class="burbuja">HOLA <em>ALICT</em>,<br>¿CÓMO ESTÁS HOY?</div>
    <button id="start" class="big-btn">
      <svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#fff"/></svg>
      ¡VAMOS A JUGAR!
    </button>
  </section>

  <!-- Menú -->
  <section id="menu" class="screen">
    <div class="menu-head">
      <div class="cara mini" id="caraMenu"><img class="foto" alt=""></div>
      <div class="burbuja lado" id="menuTxt">¿QUÉ QUIERES<br>APRENDER HOY?</div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="aprender">APRENDER</button>
      <button class="tab" data-tab="jugar">JUGAR</button>
    </div>
    <div class="modes" id="modes"></div>
    <div class="modes" id="juegos" hidden></div>
  </section>

  <!-- Juego -->
  <section id="game" class="screen">
    <div class="hud">
      <button id="home" class="icon" aria-label="Menú">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="#fff"/></svg>
      </button>
      <div class="dots" id="dots"></div>
      <div class="pill" id="pScore" title="Aciertos">
        <svg viewBox="0 0 24 24"><path fill="#ffd43b" stroke="#b8860b" stroke-width="1.2" stroke-linejoin="round" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
        <b id="score">0</b>
      </div>
      <div class="pill" id="pErr" title="Errores">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ff5c5c"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
        <b id="errors">0</b>
      </div>
    </div>
    <div class="card" id="card">
      <button class="cara mini" id="caraQ" aria-label="Repetir pregunta"><img class="foto" alt="">
        <span class="alt"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="#4b1d99"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#4b1d99" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span>
      </button>
      <div id="qtext"></div>
    </div>
    <div class="options" id="options"></div>
  </section>

  <!-- Minijuegos -->
  <section id="juego" class="screen">
    <div class="hud">
      <button id="homeJ" class="icon" aria-label="Menú">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="#fff"/></svg>
      </button>
      <div class="dots" id="dotsJ"></div>
      <div class="pill" id="pScoreJ" title="Logros">
        <svg viewBox="0 0 24 24"><path fill="#ffd43b" stroke="#b8860b" stroke-width="1.2" stroke-linejoin="round" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
        <b id="scoreJ">0</b>
      </div>
    </div>
    <div class="card" id="cardJ">
      <button class="cara mini" id="caraJ" aria-label="Repetir"><img class="foto" alt="">
        <span class="alt"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="#4b1d99"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#4b1d99" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span>
      </button>
      <div id="jtext"></div>
    </div>
    <div class="stage" id="stage"></div>
  </section>

  <!-- Final -->
  <section id="end" class="screen">
    <div class="cara grande" id="caraEnd"><span class="ondas"><i></i><i></i><i></i></span><img class="foto" alt=""></div>
    <div class="burbuja" id="endTitle">¡LO LOGRASTE, <em>ALICT</em>!</div>
    <div class="stats">
      <div class="stat"><svg viewBox="0 0 24 24"><path fill="#ffd43b" stroke="#b8860b" stroke-width="1.2" stroke-linejoin="round" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg><span id="endScore"></span></div>
      <div class="stat"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ff5c5c"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg><span id="endErr"></span></div>
    </div>
    <div class="end-btns">
      <button id="again" class="big-btn">OTRA VEZ</button>
      <button id="toMenu" class="big-btn alt">MENÚ</button>
    </div>
  </section>
</div>

/* =============== Sonido y voz =============== */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, t0, d, type = 'sine', v = .2) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .05);
}
const sfxOk  = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .11, .35, 'triangle', .22));
const sfxBad = () => { tone(220, 0, .2, 'triangle', .25); tone(165, .16, .3, 'triangle', .25); };
function sfxPop() {
  const a = audio(); if (!a) return;
  const len = a.sampleRate * .25, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'bandpass'; f.frequency.value = 900 + Math.random() * 900; g.gain.value = .35;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}

let voz = null, hablando = 0;
function elegirVoz() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  voz = vs.find(v => /^es[-_]MX/i.test(v.lang)) || vs.find(v => /^es[-_]US/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { elegirVoz(); speechSynthesis.onvoiceschanged = elegirVoz; }

const habla = on => document.body.classList.toggle('habla', on);
function say(texto, { onstart, onend, onerror } = {}) {
  const id = ++hablando;
  let fin = false;
  const terminar = () => { if (!fin && id === hablando) { fin = true; habla(false); onend && onend(); } };
  if (!('speechSynthesis' in window)) { habla(true); onerror && onerror('no-soportado'); setTimeout(terminar, 1800); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = voz ? voz.lang : 'es-MX'; if (voz) u.voice = voz;
    u.rate = .92; u.pitch = 1.15; u.volume = 1;
    u.onstart = () => onstart && onstart();
    u.onend = terminar;
    u.onerror = e => { if (id === hablando) habla(false); onerror && onerror(e.error); };
    speechSynthesis.speak(u);
    habla(true);
    setTimeout(terminar, 1500 + texto.length * 110);   // respaldo si el navegador no avisa que terminó
  } catch (e) { onerror && onerror(String(e)); }
}
const callar = () => { hablando++; habla(false); try { speechSynthesis.cancel(); } catch (e) {} };

/* =============== Globos y fuegos artificiales =============== */
const fx = $('#fx'), g2 = fx.getContext('2d');
let parts = [], raf = 0;
function ajustarCanvas() {
  const d = window.devicePixelRatio || 1;
  fx.width = innerWidth * d; fx.height = innerHeight * d; g2.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', ajustarCanvas); ajustarCanvas();

function estallido(x, y) {
  const hue = Math.random() * 360, n = 56;
  for (let i = 0; i < n; i++) {
    const a = Math.PI * 2 * i / n + Math.random() * .2, s = 2 + Math.random() * 5;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: .011 + Math.random() * .012,
                 c: `hsl(${(hue + Math.random() * 60) % 360},100%,62%)`, r: 2 + Math.random() * 2.2 });
  }
  sfxPop();
  if (!raf) raf = requestAnimationFrame(cuadro);
}
function chispas(x, y, color, n = 16) {
  for (let i = 0; i < n; i++) {
    const a = Math.PI * 2 * i / n + Math.random() * .4, v = 2 + Math.random() * 4;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, decay: .03 + Math.random() * .02,
                 c: color || `hsl(${Math.random() * 360},100%,62%)`, r: 2 + Math.random() * 2.4 });
  }
  if (!raf) raf = requestAnimationFrame(cuadro);
}
function cuadro() {
  g2.globalCompositeOperation = 'destination-out'; g2.fillStyle = 'rgba(0,0,0,.22)'; g2.fillRect(0, 0, innerWidth, innerHeight);
  g2.globalCompositeOperation = 'lighter';
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += .055; p.vx *= .985; p.vy *= .985; p.life -= p.decay;
    g2.globalAlpha = Math.max(p.life, 0); g2.fillStyle = p.c;

JUEGOS.corre = {

    const tema = TEMAS_CORRE[a.n % TEMAS_CORRE.length], meta = 10, { w: W, h: H } = a;

    const [cv, c] = lienzo('lienzo', W, H); stg.appendChild(cv);
    const cuenta = crearCuenta(stg, meta), horiz = W > H * 1.15;
    const R = Math.max(34, Math.min(60, Math.min(W, H) * .105)), vel = (horiz ? W : H) / 5.2;
    const pl = { x: horiz ? W * .22 : W / 2, y: horiz ? H / 2 : H * .66 }; pl.tx = pl.x; pl.ty = pl.y;
    const camisa = rnd(['#4dabf7', '#ff6b6b', '#51cf66', '#cc5de8']);
    const items = [], fx_ = [], escena = Array.from({ length: 20 }, () => ({ x: rango(0, W), y: rango(0, H), s: rango(.6, 1.5), c: rnd(PALETA), f: rango(0, 7) }));
    let n = 0, vivo = true, raf = 0, ult = performance.now(), sp = .3, t = 0, acabo = false;
    const alto = R * 2.3;

    const mueve = e => {
      const p = posEn(cv, e), off = e.pointerType === 'mouse' ? 0 : R * 1.5;

    };

    cv.addEventListener('pointermove', mueve);

    function crear() {
      const tipo = rnd(tema.items), r = R * rango(.62, .82);
      const cerca = Math.random() < .55;

      if (horiz) { x = W + r * 2; y = cerca ? Math.max(r, Math.min(H - r, pl.y + R + rango(-H * .3, H * .3))) : rango(r, H - r); }
      else { y = -r * 2; x = cerca ? Math.max(r, Math.min(W - r, pl.x + rango(-W * .3, W * .3))) : rango(r, W - r); }
      items.push({ x, y, r, tipo, c: rnd(PALETA), f: rango(0, 7), vx: horiz ? -vel : 0, vy: horiz ? 0 : vel });
    }

      if (!vivo) return;

      pl.x += (pl.tx - pl.x) * Math.min(1, dt * 9); pl.y += (pl.ty - pl.y) * Math.min(1, dt * 9);
      if (!acabo) { sp -= dt; if (sp <= 0) { crear(); sp = rango(.55, .95); } }

      <rect x="18" y="46" width="64" height="44" rx="6" fill="#ff7aa8" ${ln()}/><rect x="12" y="34" width="76" height="18" rx="5" fill="#ffd43b" ${ln()}/>
      <rect x="44" y="34" width="12" height="56" fill="#fff" ${ln(3)}/><path d="M50 34 Q30 6 24 20 Q22 32 50 34 Q78 32 76 20 Q70 6 50 34Z" fill="#fff" ${ln(3.5)}/>
      <text x="50" y="76" text-anchor="middle" font-size="26" font-weight="900" fill="${INK}">?</text>`) },
];
$('#juegos').innerHTML = juegosDefs.map(m =>
  `<button class="mode" data-modo="${m.modo}">${m.html}<span><b>${m.t}</b><small>${m.s}</small></span></button>`).join('');
$('#juegos').addEventListener('click', e => { const b = e.target.closest('.mode'); if (b) { audio(); empezar(b.dataset.modo); } });

function verPestana(p, hablar) {
  $('#modes').hidden = p !== 'aprender'; $('#juegos').hidden = p !== 'jugar';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === p));
  $('#menuTxt').innerHTML = p === 'aprender' ? '¿QUÉ QUIERES<br>APRENDER HOY?' : '¿A QUÉ QUIERES<br>JUGAR HOY?';
  if (hablar) say(p === 'aprender' ? '¿Qué quieres aprender hoy?' : `¿A qué quieres jugar, ${NOMBRE}?`);
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) { audio(); verPestana(b.dataset.tab, true); } });
$('#caraJ').addEventListener('click', () => { audio(); if (J.habla) say(J.habla); });
$('#homeJ').addEventListener('click', () => aMenu());


/* =============== Eventos =============== */
let saludado = false;     // el saludo ya empezó a sonar
let saludando = false;    // está sonando ahora mismo
let despuesSaludo = null; // qué hacer cuando termine de sonar
let saludoId = 0;
function saludar() {
  const mio = ++saludoId;
  const fin = () => {
    if (mio !== saludoId) return;          // lo cortó un saludo más nuevo
    saludando = false;
    const f = despuesSaludo; despuesSaludo = null; f && f();
  };
  say(`Hola ${NOMBRE}, ¿cómo estás hoy?`, {
    onstart: () => { if (mio === saludoId) { saludado = true; saludando = true; } },
    onend: fin, onerror: fin,
  });
}
$('#start').addEventListener('click', () => {
  audio();
  const irMenu = () => { ver('menu'); setTimeout(() => say('¿Qué quieres aprender hoy?'), 250); };
  if (saludando) despuesSaludo = irMenu;                       // dejar que termine de saludar
  else if (saludado) irMenu();
  else { despuesSaludo = () => { saludado = true; irMenu(); }; saludar(); }
});
$('#modes').addEventListener('click', e => { const b = e.target.closest('.mode'); if (b) { audio(); empezar(b.dataset.modo); } });
$('#home').addEventListener('click', aMenu);
$('#toMenu').addEventListener('click', aMenu);
$('#again').addEventListener('click', () => { audio(); empezar(G.modo); });
$('#caraQ').addEventListener('click', () => { audio(); const q = G.qs[G.i]; if (q) say(q.habla); });

// Al abrir: saludar de inmediato. Muchos navegadores no dejan hablar hasta que se toca la pantalla,
// así que si se bloquea, se saluda en el primer toque (en cualquier lado, menos en el botón, que ya saluda solo).
addEventListener('load', () => setTimeout(() => { if (!saludado) saludar(); }, 400));
const TOQUES = ['pointerup', 'touchend', 'mouseup', 'click', 'keydown'];
function primerToque(e) {
  if (saludado) { TOQUES.forEach(t => removeEventListener(t, primerToque, true)); return; }
  if (e.target.closest && e.target.closest('#start')) return;
  if (!$('#hello').classList.contains('active')) return;
  TOQUES.forEach(t => removeEventListener(t, primerToque, true));
  saludar();
}
TOQUES.forEach(t => addEventListener(t, primerToque, true));
document.addEventListener('visibilitychange', () => { if (document.hidden) callar(); });

// Versión en línea: se puede instalar como app y funciona sin internet
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && !window.Capacitor && document.querySelector('link[rel=manifest]'))
  navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
